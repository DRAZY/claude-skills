# Keeps stats/clones.json current so the README's clone badge shows a running
# total. GitHub exposes only 14 days of clone traffic, owner-only, so this
# reads the window daily and merges it by date (see scripts/clone-stats.mjs).
#
# Needs one repository secret, TRAFFIC_TOKEN: a fine-grained personal access
# token scoped to this repository with "Administration: read". Without it the
# job exits cleanly and the badge keeps its last value.

name: clone-stats

on:
  schedule:
    - cron: "20 9 * * *" # 09:20 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge the 14-day clone window into stats/clones.json
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "TRAFFIC_TOKEN secret is not set; skipping (badge keeps its last value)."
            exit 0
          fi
          node scripts/clone-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats/clones.json; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/clones.json
          git commit -m "stats: clone counter $(date -u +%F)"
          git push
